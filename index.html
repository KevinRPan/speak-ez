<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Communication training app — like HEVY, but for speaking skills">
  <title>Speak-EZ</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="app">
    <div class="app-body">
      <!-- Header -->
      <header class="header">
        <div class="header-title">Speak-EZ</div>
        <div class="header-stats">
          <div class="header-stat" title="Day streak">
            <span class="icon" aria-hidden="true">🔥</span>
            <span class="value" id="header-streak" aria-label="Day streak">0</span>
          </div>
          <div class="header-stat" title="Experience points">
            <span class="value" id="header-xp">0 XP</span>
          </div>
          <div class="header-stat" title="Level">
            <span class="value" id="header-level">LVL 1</span>
          </div>
        </div>
      </header>

      <!-- Screen Container -->
      <main class="screen-container"></main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Primary">
      <div class="nav-brand">
        <div class="nav-brand-name">Speak<span>-EZ</span></div>
        <div class="nav-brand-tag">Speaking practice</div>
      </div>
      <button class="nav-item active" data-tab="home" aria-current="page">
        <span class="nav-icon" aria-hidden="true">🏠</span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-tab="tracks">
        <span class="nav-icon" aria-hidden="true">🎓</span>
        <span class="nav-label">Tracks</span>
      </button>
      <button class="nav-item" data-tab="performance">
        <span class="nav-icon" aria-hidden="true">📊</span>
        <span class="nav-label">Progress</span>
      </button>
      <button class="nav-item" data-tab="scenarios">
        <span class="nav-icon" aria-hidden="true">🎬</span>
        <span class="nav-label">Scenarios</span>
      </button>
      <button class="nav-item" data-tab="interview-setup">
        <span class="nav-icon" aria-hidden="true">💼</span>
        <span class="nav-label">Interview</span>
      </button>
      <button class="nav-item" data-tab="profile">
        <span class="nav-icon" aria-hidden="true">👤</span>
        <span class="nav-label">Profile</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
